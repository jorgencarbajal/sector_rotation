[project]
name = "sector-rotation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "matplotlib>=3.9",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sector_rotation"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
